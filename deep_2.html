<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0, minimum-scale=1.0, shrink-to-fit=no">
  <title>Frappe de Bébé & Penalties • Jeux Magiques</title>
  <!-- Google Fonts : Nunito pour la rondeur -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    /* RESET & PLEIN ÉCRAN */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: #fce4ec;
      font-family: 'Nunito', sans-serif;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* ÉCRAN D'ACCUEIL (sélection mode) */
    #mode-selector {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, #ffe0f0, #f8bbd0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
      opacity: 1;
      pointer-events: auto;
      gap: 2rem;
    }
    #mode-selector.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .mode-button {
      background: #ff4081;
      border: none;
      color: white;
      font-size: 2.5rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      padding: 1.2rem 2.5rem;
      border-radius: 120px;
      box-shadow: 0 20px 35px rgba(255,64,129,0.5);
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s;
      touch-action: manipulation;
      background: linear-gradient(135deg, #ff80ab, #f50057);
      border: 4px solid white;
      width: 80%;
      max-width: 400px;
      text-align: center;
    }
    .mode-button:active {
      transform: scale(0.92);
      box-shadow: 0 10px 20px rgba(255,64,129,0.7);
    }
    .mode-button.penalty {
      background: linear-gradient(135deg, #4caf50, #2e7d32);
      box-shadow: 0 20px 35px rgba(76,175,80,0.5);
    }

    /* CANVAS PARTICULES (fond animé) */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* CONTENEUR PRINCIPAL */
    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* MODE BÉBÉ (frappe aléatoire) */
    #baby-mode {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    #baby-mode.active {
      display: flex;
    }
    .character {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.1s ease;
      pointer-events: none;
      z-index: 5;
      animation: breathe 2.5s ease-in-out infinite;
    }
    @keyframes breathe {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .character.jump { animation: jumpAnim 0.4s ease-out; }
    @keyframes jumpAnim {
      0% { transform: translateY(0); } 50% { transform: translateY(-25px); } 100% { transform: translateY(0); }
    }
    .character.wiggle { animation: wiggleAnim 0.3s ease-in-out; }
    @keyframes wiggleAnim {
      0% { transform: rotate(0); } 25% { transform: rotate(8deg); } 75% { transform: rotate(-8deg); } 100% { transform: rotate(0); }
    }
    .character.spin { animation: spinAnim 0.5s ease-in-out; }
    @keyframes spinAnim {
      0% { transform: rotate(0); } 100% { transform: rotate(360deg); }
    }
    .character.grow { animation: growAnim 0.35s ease-in-out; }
    @keyframes growAnim {
      0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); }
    }

    .hat {
      width: 0; height: 0; border-left: 35px solid transparent; border-right: 35px solid transparent;
      border-bottom: 55px solid #ffb74d; filter: drop-shadow(0 6px 4px rgba(0,0,0,0.15)); margin-bottom: -8px; transition: border-bottom-color 0.2s;
    }
    .body-shape {
      width: 130px; height: 110px; background: #ffcc80; border-radius: 50% 50% 45% 45%; position: relative;
      box-shadow: 0 12px 18px rgba(0,0,0,0.15); transition: background 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .eyes-container { display: flex; gap: 22px; margin-top: 10px; }
    .eye { width: 28px; height: 28px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
    .pupil { width: 14px; height: 14px; background: #3e2723; border-radius: 50%; transition: all 0.1s; }
    .eye.happy .pupil { height: 6px; border-radius: 0 0 50% 50%; background: #3e2723; margin-top: 5px; }
    .eye.surprised .pupil { width: 18px; height: 18px; }
    .eye.love .pupil { background: transparent; position: relative; }
    .eye.love .pupil::before, .eye.love .pupil::after { content: "❤️"; position: absolute; font-size: 20px; top: -8px; left: -6px; }
    .cheeks { display: flex; gap: 70px; margin-top: -8px; }
    .cheek { width: 22px; height: 14px; background: #ff8a80; border-radius: 50%; opacity: 0.7; }
    .mouth { width: 30px; height: 12px; background: #c62828; border-radius: 0 0 25px 25px; margin-top: 6px; transition: all 0.2s; }
    .mouth.open { width: 25px; height: 22px; border-radius: 0 0 25px 25px; background: #b71c1c; }
    .mouth.bigsmile { width: 40px; height: 20px; border-radius: 0 0 40px 40px; }
    .mouth.oh { width: 24px; height: 24px; border-radius: 50%; background: #b71c1c; }
    .legs { display: flex; gap: 30px; margin-top: 2px; }
    .leg { width: 18px; height: 25px; background: #ffb74d; border-radius: 0 0 12px 12px; }
    .speech-bubble {
      position: absolute; top: -55px; background: white; border-radius: 30px; padding: 8px 18px; font-size: 2.2rem;
      box-shadow: 0 8px 12px rgba(0,0,0,0.1); opacity: 0; transform: translateY(10px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap;
    }
    .speech-bubble.show { opacity: 1; transform: translateY(0); }

    /* MODE PENALTIES */
    #penalty-mode {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
    }
    #penalty-mode.active { display: block; }
    .pitch {
      width: 100%; height: 100%; position: relative; overflow: hidden;
    }
    .goal {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      border: 8px solid white;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      z-index: 5;
    }
    /* Zones tactiles dans la cage */
    .goal-zone {
      position: absolute;
      bottom: 0;
      height: 100%;
      width: 33.33%;
      z-index: 6;
    }
    .goal-zone.left { left: 0; }
    .goal-zone.center { left: 33.33%; }
    .goal-zone.right { left: 66.66%; }
    .goal-zone-indicator {
      position: absolute;
      bottom: 5px;
      font-size: 1.5rem;
      color: white;
      opacity: 0.7;
      pointer-events: none;
    }
    .goalkeeper {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 70px;
      background: #ff5722;
      border-radius: 40% 40% 20% 20%;
      transition: left 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      z-index: 10;
      pointer-events: none;
    }
    .ball {
      position: absolute;
      bottom: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: white;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, white, #e0e0e0);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .power-bar {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 25px;
      background: rgba(0,0,0,0.3);
      border-radius: 15px;
      overflow: hidden;
    }
    .power-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffeb3b, #ff9800, #f44336);
      transition: width 0.1s;
      border-radius: 15px;
    }
    .message-penalty {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      font-weight: 800;
      color: white;
      text-shadow: 3px 3px 0 #000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .score-penalty {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      color: white;
      font-weight: 800;
    }
    .instruction {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 1.2rem;
      background: rgba(0,0,0,0.4);
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
    }

    /* COMPTEUR (bébé) */
    #counter {
      position: absolute;
      top: 18px;
      right: 25px;
      font-size: 2.5rem;
      font-weight: 800;
      color: white;
      text-shadow: 2px 2px 0 #ff4081;
      z-index: 20;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(10px);
      padding: 0.2rem 1.2rem;
      border-radius: 60px;
      display: none;
    }
    #counter.active { display: block; }

    /* BOUTON RETOUR */
    .back-btn {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 30;
      background: white;
      border: none;
      font-size: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      display: none;
    }
    .back-btn.active { display: flex; align-items: center; justify-content: center; }

    .flying-emoji {
      position: absolute;
      font-size: 4rem;
      pointer-events: none;
      z-index: 25;
      animation: flyUp 0.9s ease-out forwards;
      user-select: none;
    }
    @keyframes flyUp {
      0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
      30% { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1.3); }
      100% { opacity: 0; transform: translate(var(--dx2), var(--dy2)) scale(0.6); }
    }
  </style>
</head>
<body>
  <!-- ÉCRAN DE SÉLECTION DE MODE -->
  <div id="mode-selector">
    <button class="mode-button" id="baby-mode-btn">👶 Frappe Aléatoire</button>
    <button class="mode-button penalty" id="penalty-mode-btn">⚽ Penalties</button>
  </div>

  <!-- Canvas particules -->
  <canvas id="particle-canvas"></canvas>

  <!-- COMPTEUR BÉBÉ -->
  <div id="counter">0</div>

  <!-- BOUTON RETOUR -->
  <button class="back-btn" id="back-button">←</button>

  <!-- CONTENEUR DE JEU -->
  <div id="game-container">
    <!-- MODE BÉBÉ -->
    <div id="baby-mode">
      <div class="character" id="character">
        <div class="speech-bubble" id="speech-bubble">🐣</div>
        <div class="hat" id="hat"></div>
        <div class="body-shape" id="body-shape">
          <div class="eyes-container" id="eyes-container">
            <div class="eye" id="left-eye"><div class="pupil"></div></div>
            <div class="eye" id="right-eye"><div class="pupil"></div></div>
          </div>
          <div class="cheeks">
            <div class="cheek"></div>
            <div class="cheek"></div>
          </div>
          <div class="mouth" id="mouth"></div>
        </div>
        <div class="legs">
          <div class="leg"></div>
          <div class="leg"></div>
        </div>
      </div>
    </div>

    <!-- MODE PENALTIES -->
    <div id="penalty-mode">
      <div class="pitch">
        <div class="goal" id="goal">
          <div class="goal-zone left" id="zone-left"><span class="goal-zone-indicator">⬅️</span></div>
          <div class="goal-zone center" id="zone-center"><span class="goal-zone-indicator">⬆️</span></div>
          <div class="goal-zone right" id="zone-right"><span class="goal-zone-indicator">➡️</span></div>
        </div>
        <div class="goalkeeper" id="goalkeeper">🧤</div>
        <div class="ball" id="ball">⚽</div>
        <div class="power-bar">
          <div class="power-fill" id="power-fill"></div>
        </div>
        <div class="score-penalty" id="score-display">Buts: 0</div>
        <div class="message-penalty" id="message-penalty"></div>
        <div class="instruction">⚽ Touche le ballon puis touche la cage pour tirer</div>
      </div>
    </div>
  </div>

  <!-- COUCHE INTERACTIVE BÉBÉ -->
  <div id="interactive-layer" style="position:absolute;inset:0;z-index:10;display:none;"></div>

  <script>
    (function() {
      // ---------- ÉTAT GLOBAL ----------
      let audioCtx = null;
      let currentMode = null;
      let tapCount = 0;
      let bgColorChangeCounter = 0;
      
      // DOM
      const modeSelector = document.getElementById('mode-selector');
      const babyModeDiv = document.getElementById('baby-mode');
      const penaltyModeDiv = document.getElementById('penalty-mode');
      const interactiveLayer = document.getElementById('interactive-layer');
      const counterDisplay = document.getElementById('counter');
      const backButton = document.getElementById('back-button');
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');

      // Bébé
      const character = document.getElementById('character');
      const bodyShape = document.getElementById('body-shape');
      const hat = document.getElementById('hat');
      const leftEye = document.getElementById('left-eye');
      const rightEye = document.getElementById('right-eye');
      const mouth = document.getElementById('mouth');
      const speechBubble = document.getElementById('speech-bubble');

      // Penalty
      const goalkeeper = document.getElementById('goalkeeper');
      const ball = document.getElementById('ball');
      const powerFill = document.getElementById('power-fill');
      const scoreDisplay = document.getElementById('score-display');
      const messagePenalty = document.getElementById('message-penalty');
      const zoneLeft = document.getElementById('zone-left');
      const zoneCenter = document.getElementById('zone-center');
      const zoneRight = document.getElementById('zone-right');

      let penaltyScore = 0;
      let powerInterval = null;
      let currentPower = 0;
      let powerIncreasing = true;
      let isCharging = false;
      let shotInProgress = false;

      // Couleurs et données
      const cuteEmojis = ['🐣','🐥','🐻','🐼','🐨','🦊','🐸','🐙','🍭','🍬','🧁','🍩','🌈','⭐','🌟','💖','🎈','🎀','🐞','🌼'];
      const pastelGradients = [
        ['#fce4ec', '#f8bbd0'], ['#e0f7fa', '#b2ebf2'], ['#f3e5f5', '#e1bee7'],
        ['#fff3e0', '#ffccbc'], ['#e8f5e9', '#c8e6c9'], ['#f1f8e9', '#dcedc8'], ['#ede7f6', '#d1c4e9']
      ];
      const animClasses = ['jump', 'wiggle', 'spin', 'grow'];
      const expressions = {
        normal: ()=>{ leftEye.className='eye'; rightEye.className='eye'; mouth.className='mouth'; },
        happy: ()=>{ leftEye.className='eye happy'; rightEye.className='eye happy'; mouth.className='mouth bigsmile'; },
        surprised: ()=>{ leftEye.className='eye surprised'; rightEye.className='eye surprised'; mouth.className='mouth oh'; },
        love: ()=>{ leftEye.className='eye love'; rightEye.className='eye love'; mouth.className='mouth open'; }
      };
      const bodyColors = ['#ffcc80','#ffab91','#bcaaa4','#a5d6a7','#90caf9','#f48fb1','#ce93d8'];
      const hatColors = ['#ffb74d','#ef5350','#66bb6a','#42a5f5','#ab47bc','#ff7043','#26c6da'];

      let particles = [];

      // ---------- AUDIO ----------
      function createAudioContext() {
        if (audioCtx) return audioCtx;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        } catch(e) { return null; }
      }

      function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        if(type==='boing') {
          osc.type='sine'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(600,now+0.1);
          gain.gain.setValueAtTime(0.4,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.3);
          osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now+0.3);
        } else if(type==='pop') {
          osc.type='triangle'; osc.frequency.setValueAtTime(500,now); osc.frequency.exponentialRampToValueAtTime(200,now+0.15);
          gain.gain.setValueAtTime(0.35,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.2);
          osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now+0.2);
        } else if(type==='goal') {
          osc.type='square'; osc.frequency.setValueAtTime(600,now); osc.frequency.setValueAtTime(900,now+0.15);
          gain.gain.setValueAtTime(0.3,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.4);
          osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now+0.4);
        } else if(type==='save') {
          osc.type='sawtooth'; osc.frequency.setValueAtTime(200,now); osc.frequency.linearRampToValueAtTime(100,now+0.2);
          gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.3);
          osc.connect(gain).connect(audioCtx.destination); osc.start(now); osc.stop(now+0.3);
        }
      }

      // ---------- CANVAS ----------
      function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resizeCanvas); resizeCanvas();

      class Particle {
        constructor(x,y,type){ this.x=x;this.y=y;this.type=type;this.size=Math.random()*15+6;this.vx=(Math.random()-0.5)*8;this.vy=(Math.random()-0.5)*8-2;this.life=1;this.decay=0.015+Math.random()*0.03;this.color=`hsl(${Math.floor(Math.random()*360)},80%,70%)`; }
        update(){ this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;this.life-=this.decay; }
        draw(ctx){ ctx.save();ctx.globalAlpha=this.life;ctx.fillStyle=this.color;if(this.type==='circle'){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();}else if(this.type==='square'){ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);}else if(this.type==='star'){ctx.font=`${this.size*2}px Nunito`;ctx.fillText('⭐',this.x-this.size,this.y-this.size/2);}ctx.restore(); }
        get alive(){ return this.life>0; }
      }
      function burstParticles(x,y){ for(let i=0;i<12;i++) particles.push(new Particle(x,y,['circle','circle','square','star'][Math.floor(Math.random()*4)])); }
      function animateParticles(){ ctx.clearRect(0,0,canvas.width,canvas.height); particles=particles.filter(p=>p.alive); particles.forEach(p=>{p.update();p.draw(ctx);}); requestAnimationFrame(animateParticles); }
      animateParticles();

      function spawnFlyingEmojis(x,y){ const count=Math.floor(Math.random()*3)+2; for(let i=0;i<count;i++){ const emoji=cuteEmojis[Math.floor(Math.random()*cuteEmojis.length)]; const el=document.createElement('div'); el.className='flying-emoji'; el.textContent=emoji; const angle=Math.random()*Math.PI*2; const distance=50+Math.random()*70; el.style.setProperty('--dx',Math.cos(angle)*distance+'px'); el.style.setProperty('--dy',Math.sin(angle)*distance-30+'px'); el.style.setProperty('--dx2',Math.cos(angle)*distance*1.8+'px'); el.style.setProperty('--dy2',Math.sin(angle)*distance*1.8-40+'px'); el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el); el.addEventListener('animationend',()=>el.remove()); } }

      // ---------- MODE BÉBÉ ----------
      function randomizeBabyCharacter() {
        bodyShape.style.background = bodyColors[Math.floor(Math.random()*bodyColors.length)];
        hat.style.borderBottomColor = hatColors[Math.floor(Math.random()*hatColors.length)];
        character.classList.remove(...animClasses); void character.offsetWidth;
        character.classList.add(animClasses[Math.floor(Math.random()*animClasses.length)]);
        expressions[Object.keys(expressions)[Math.floor(Math.random()*4)]]();
        speechBubble.textContent = cuteEmojis[Math.floor(Math.random()*cuteEmojis.length)];
        speechBubble.classList.add('show'); clearTimeout(window.bubbleTimeout);
        window.bubbleTimeout = setTimeout(()=>speechBubble.classList.remove('show'),1200);
      }
      function changeBackgroundBaby(){ document.body.style.background = `radial-gradient(circle at 30% 30%, ${pastelGradients[Math.floor(Math.random()*pastelGradients.length)][0]}, ${pastelGradients[Math.floor(Math.random()*pastelGradients.length)][1]})`; }
      function handleBabyInteraction(e){
        e.preventDefault();
        if(e.touches){ for(let i=0;i<e.touches.length;i++) triggerBabyReaction(e.touches[i].clientX,e.touches[i].clientY); }
        else triggerBabyReaction(e.clientX,e.clientY);
      }
      function triggerBabyReaction(x,y){
        tapCount++; counterDisplay.textContent=tapCount;
        bgColorChangeCounter++; if(bgColorChangeCounter%3===0) changeBackgroundBaby();
        randomizeBabyCharacter(); playSound(['boing','pop'][Math.floor(Math.random()*2)]);
        burstParticles(x,y); spawnFlyingEmojis(x,y);
      }
      function bindBabyEvents(){
        interactiveLayer.addEventListener('click',handleBabyInteraction);
        interactiveLayer.addEventListener('touchstart',handleBabyInteraction,{passive:false});
        interactiveLayer.addEventListener('touchmove',(e)=>{e.preventDefault();if(e.touches.length>0)for(let i=0;i<e.touches.length;i++)triggerBabyReaction(e.touches[i].clientX,e.touches[i].clientY);},{passive:false});
        document.addEventListener('keydown',(e)=>{ triggerBabyReaction(window.innerWidth/2,window.innerHeight/2); });
      }

      // ---------- MODE PENALTIES (NOUVELLE VERSION) ----------
      function resetPenalty() {
        goalkeeper.style.left = '50%';
        ball.style.left = '50%';
        ball.style.bottom = '30%';
        ball.style.transform = 'translateX(-50%)';
        powerFill.style.width = '0%';
        currentPower = 0;
        powerIncreasing = true;
        isCharging = false;
        shotInProgress = false;
        if(powerInterval) clearInterval(powerInterval);
        messagePenalty.style.opacity = '0';
      }

      function startCharging() {
        if(shotInProgress || isCharging) return;
        isCharging = true;
        powerInterval = setInterval(() => {
          if(powerIncreasing) {
            currentPower += 2;
            if(currentPower >= 100) { currentPower = 100; powerIncreasing = false; }
          } else {
            currentPower -= 2;
            if(currentPower <= 0) { currentPower = 0; powerIncreasing = true; }
          }
          powerFill.style.width = currentPower + '%';
        }, 20);
      }

      function shootAtZone(zone) {
        if(!isCharging || shotInProgress) return;
        clearInterval(powerInterval);
        isCharging = false;
        shotInProgress = true;
        
        const power = currentPower / 100;
        
        // Gardien plonge aléatoirement
        const keeperPositions = ['15%', '50%', '85%'];
        const keeperChoice = keeperPositions[Math.floor(Math.random()*3)];
        goalkeeper.style.left = keeperChoice;
        
        // Direction selon zone touchée
        let ballTarget;
        if(zone === 'left') ballTarget = '18%';
        else if(zone === 'right') ballTarget = '82%';
        else ballTarget = '50%';
        
        ball.style.left = ballTarget;
        ball.style.bottom = (30 + power * 45) + '%';
        
        setTimeout(() => {
          const keeperLeft = parseFloat(goalkeeper.style.left);
          const ballLeft = parseFloat(ball.style.left);
          const distance = Math.abs(keeperLeft - ballLeft);
          
          // Logique de but
          if((distance > 30 && power > 0.4) || (zone !== 'center' && distance > 20 && power > 0.5)) {
            // BUT !
            penaltyScore++;
            scoreDisplay.textContent = 'Buts: ' + penaltyScore;
            messagePenalty.textContent = '⚽ BUUUUT ! 🎉';
            messagePenalty.style.opacity = '1';
            playSound('goal');
            burstParticles(window.innerWidth/2, 150);
            spawnFlyingEmojis(window.innerWidth/2, 150);
          } else {
            // Arrêt
            messagePenalty.textContent = '🧤 Arrêté !';
            messagePenalty.style.opacity = '1';
            playSound('save');
          }
          
          setTimeout(() => resetPenalty(), 1500);
        }, 500);
      }

      function bindPenaltyEvents() {
        // Toucher le ballon pour charger
        ball.addEventListener('click', (e) => {
          e.stopPropagation();
          startCharging();
        });
        ball.addEventListener('touchstart', (e) => {
          e.preventDefault();
          e.stopPropagation();
          startCharging();
        });
        
        // Zones de la cage
        zoneLeft.addEventListener('click', (e) => { e.stopPropagation(); shootAtZone('left'); });
        zoneCenter.addEventListener('click', (e) => { e.stopPropagation(); shootAtZone('center'); });
        zoneRight.addEventListener('click', (e) => { e.stopPropagation(); shootAtZone('right'); });
        
        zoneLeft.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); shootAtZone('left'); });
        zoneCenter.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); shootAtZone('center'); });
        zoneRight.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); shootAtZone('right'); });
        
        // Clavier
        document.addEventListener('keydown', (e) => {
          if(currentMode !== 'penalty') return;
          if(e.code === 'Space') { e.preventDefault(); startCharging(); }
          if(e.code === 'ArrowLeft') shootAtZone('left');
          if(e.code === 'ArrowUp') shootAtZone('center');
          if(e.code === 'ArrowRight') shootAtZone('right');
        });
      }

      // ---------- CHANGEMENT DE MODE ----------
      function switchToMode(mode) {
        currentMode = mode;
        modeSelector.classList.add('hidden');
        
        if(mode === 'baby') {
          babyModeDiv.classList.add('active');
          penaltyModeDiv.classList.remove('active');
          interactiveLayer.style.display = 'block';
          counterDisplay.classList.add('active');
          backButton.classList.add('active');
          document.body.style.background = '#fce4ec';
          changeBackgroundBaby();
          bindBabyEvents();
          if(!audioCtx) createAudioContext();
        } else if(mode === 'penalty') {
          penaltyModeDiv.classList.add('active');
          babyModeDiv.classList.remove('active');
          interactiveLayer.style.display = 'none';
          counterDisplay.classList.remove('active');
          backButton.classList.add('active');
          document.body.style.background = 'linear-gradient(180deg, #4caf50, #2e7d32)';
          resetPenalty();
          bindPenaltyEvents();
          if(!audioCtx) createAudioContext();
        }
      }

      function goBackToMenu() {
        currentMode = null;
        babyModeDiv.classList.remove('active');
        penaltyModeDiv.classList.remove('active');
        interactiveLayer.style.display = 'none';
        counterDisplay.classList.remove('active');
        backButton.classList.remove('active');
        modeSelector.classList.remove('hidden');
        document.body.style.background = '#fce4ec';
        if(powerInterval) clearInterval(powerInterval);
        resetPenalty();
        particles = [];
      }

      // ---------- INIT ----------
      document.getElementById('baby-mode-btn').addEventListener('click', ()=> switchToMode('baby'));
      document.getElementById('penalty-mode-btn').addEventListener('click', ()=> switchToMode('penalty'));
      backButton.addEventListener('click', goBackToMenu);

      document.addEventListener('gesturestart', (e)=> e.preventDefault());
      document.addEventListener('gesturechange', (e)=> e.preventDefault());
      document.addEventListener('gestureend', (e)=> e.preventDefault());
      window.addEventListener('load', resizeCanvas);
    })();
  </script>
</body>
</html>
